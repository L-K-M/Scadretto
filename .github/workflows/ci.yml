name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository scripts
        run: |
          set -euo pipefail
          shellcheck -x Scripts/*.sh Scripts/bootstrap-macos Scripts/build-engine Scripts/verify-engine Scripts/stage-worker Scripts/verify Scripts/package-macos Scripts/benchmark-macos Engine/build-dependencies
          Scripts/build.sh --help
          Scripts/release.sh --help
          Scripts/verify --help
          Scripts/package-macos --help
          # The image's Source folder archives HEAD, so a distribution package must refuse a
          # working tree that differs from it.
          touch package-check-untracked
          if Scripts/package-macos --distribution --version 1.2.3 --build 1 \
               --output "$RUNNER_TEMP/check.dmg" > "$RUNNER_TEMP/modified-tree" 2>&1; then
            echo 'Packaged a distribution build from a modified tree.' >&2
            exit 1
          fi
          rm package-check-untracked
          grep -F 'the working tree differs from HEAD' "$RUNNER_TEMP/modified-tree"
          # Other local users can read command lines, so notarytool reads its password from a keychain.
          if grep -n -e '--password' Scripts/package-macos; then
            echo 'Scripts/package-macos passes a password on a command line.' >&2
            exit 1
          fi
          if Scripts/release.sh --preflight 01.2.3 > "$RUNNER_TEMP/invalid-version" 2>&1; then
            echo 'Accepted a malformed version.' >&2
            exit 1
          fi
          grep -F 'specify a release version' "$RUNNER_TEMP/invalid-version"
          if [[ ! -f Scadretto.xcodeproj/project.pbxproj ]]; then
            if Scripts/build.sh > "$RUNNER_TEMP/build-preflight" 2>&1; then
              echo 'Accepted a build without the Xcode project.' >&2
              exit 1
            fi
            grep -F 'Scadretto.xcodeproj is pending M1' "$RUNNER_TEMP/build-preflight"
            if Scripts/release.sh --preflight 1.2.3 > "$RUNNER_TEMP/release-preflight" 2>&1; then
              echo 'Accepted a release without the Xcode project.' >&2
              exit 1
            fi
            grep -F 'distribution requires the Xcode project' "$RUNNER_TEMP/release-preflight"
          else
            Scripts/release.sh --preflight 1.2.3
          fi

  engine:
    name: Pinned engine on arm64 macOS
    runs-on: macos-15
    timeout-minutes: 55
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      SCADRETTO_ENGINE_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: brew install cmake ninja pkgconf bison flex meson gettext
      - name: Cache pinned dependency archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build/engine/downloads
          key: engine-downloads-${{ hashFiles('Engine/dependencies.lock') }}
      - name: Build pinned reference and worker
        run: Scripts/build-engine
      - name: Verify trace and geometry
        run: Scripts/verify-engine
      - name: Retain engine verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-verification
          path: .build/engine/verification.*/**
          include-hidden-files: true
      - name: Archive the developer worker runtime
        run: tar -cf "$RUNNER_TEMP/scadretto-worker.tar" -C .build/engine/worker .
      - name: Upload the developer worker runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-runtime
          path: ${{ runner.temp }}/scadretto-worker.tar
          if-no-files-found: error

  document:
    name: Source package and document app
    needs: engine
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the checked worker runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-runtime
          path: ${{ runner.temp }}
      - name: Restore the worker runtime
        run: |
          mkdir -p .build/engine/worker
          tar -xf "$RUNNER_TEMP/scadretto-worker.tar" -C .build/engine/worker
          test -x .build/engine/worker/bin/scadretto-engine
      # The planner's live matrix skips without a worker, so it runs after restoring one.
      - name: Run package tests
        run: swift test --package-path Packages/ScadrettoKit
      - name: Build app and UI test bundle
        run: |
          xcodebuild -project Scadretto.xcodeproj -scheme Scadretto \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO \
            build-for-testing
