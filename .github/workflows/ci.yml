name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository scripts
        run: |
          set -euo pipefail
          shellcheck -x Scripts/*.sh Scripts/bootstrap-macos Scripts/build-engine Scripts/verify-engine Engine/build-dependencies
          Scripts/build.sh --help
          Scripts/release.sh --help
          if Scripts/release.sh --preflight 01.2.3 > "$RUNNER_TEMP/invalid-version" 2>&1; then
            echo 'Accepted a malformed version.' >&2
            exit 1
          fi
          grep -F 'specify a release version' "$RUNNER_TEMP/invalid-version"
          if [[ ! -f Scadretto.xcodeproj/project.pbxproj ]]; then
            if Scripts/build.sh > "$RUNNER_TEMP/build-preflight" 2>&1; then
              echo 'Accepted a build without the Xcode project.' >&2
              exit 1
            fi
            grep -F 'Scadretto.xcodeproj is pending M1' "$RUNNER_TEMP/build-preflight"
            if Scripts/release.sh --preflight 1.2.3 > "$RUNNER_TEMP/release-preflight" 2>&1; then
              echo 'Accepted a release without the Xcode project.' >&2
              exit 1
            fi
            grep -F 'distribution requires the Xcode project' "$RUNNER_TEMP/release-preflight"
          fi

  engine:
    name: Pinned engine on arm64 macOS
    runs-on: macos-15
    timeout-minutes: 55
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      SCADRETTO_ENGINE_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: brew install cmake ninja pkgconf bison flex meson gettext
      - name: Cache pinned dependency archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build/engine/downloads
          key: engine-downloads-${{ hashFiles('Engine/dependencies.lock') }}
      - name: Build pinned reference and worker
        run: Scripts/build-engine
      - name: Verify trace and geometry
        run: Scripts/verify-engine
      - name: Retain engine verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-verification
          path: .build/engine/verification.*/**
          include-hidden-files: true

  document:
    name: Source package and document app
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run package tests
        run: swift test --package-path Packages/ScadrettoKit
      - name: Build app and UI test bundle
        run: |
          xcodebuild -project Scadretto.xcodeproj -scheme Scadretto \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO \
            build-for-testing
