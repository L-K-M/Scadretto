# License and notice files that Scripts/package-macos copies into the app.
#
# Each line names a component, where its files come from, and the files, relative to that
# source. A source is an archive name from dependencies.lock (paths include the archive's top
# directory), "openscad" for the pinned checkout under .build/engine/upstream, "worker" for the
# staged worker runtime, or "spm:<identity>" for a package the app resolves. Packaging fails
# when a listed file is missing.
